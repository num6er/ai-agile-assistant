services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - FLASK_ENV=production
      - FLASK_PORT=5000
    volumes:
      # SQLite 实际存放在 instance 目录,挂载以持久化数据
      - ./backend/instance:/app/instance

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      # 容器内 localhost 指向自身,必须指向 backend 服务名
      - VITE_PROXY_TARGET=http://backend:5000
