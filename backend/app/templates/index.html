<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 敏捷开发助手</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.7.0/dist/index.css" />
  <style>
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; }
    .header { background: linear-gradient(90deg, #409eff, #6c5ce7); color: #fff; padding: 18px 32px; }
    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
    .container { max-width: 1180px; margin: 0 auto; padding: 20px; }
    .block { margin-bottom: 18px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; }
    .m-tag { margin: 0 8px 8px 0; }
    .summary { color: #666; margin: 0 0 12px; }
    .steps { margin: 16px 0; }
    .empty-mini { padding: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>AI 敏捷开发助手</h1>
      <p>PRD → 用户故事 → 任务 → 工时 → 分配 一键自动化</p>
    </div>
    <div class="container">
      <!-- 项目列表视图 -->
      <div v-if="!currentProject">
        <div class="card-head" style="margin-bottom:16px">
          <h2 style="margin:0">项目列表</h2>
          <el-button type="primary" @click="pDialog=true">+ 新建项目</el-button>
        </div>
        <el-table :data="projects" border v-loading="loading">
          <el-table-column prop="id" label="ID" width="80" />
          <el-table-column prop="name" label="项目名称" />
          <el-table-column prop="description" label="描述" show-overflow-tooltip />
          <el-table-column label="操作" width="200">
            <template #default="{ row }">
              <el-button size="small" @click="enterProject(row)">进入</el-button>
              <el-button size="small" type="danger" @click="removeProject(row.id)">删除</el-button>
            </template>
          </el-table-column>
        </el-table>
      </div>

      <!-- 项目详情视图 -->
      <div v-else>
        <el-page-header @back="currentProject=null" :content="currentProject.name" />

        <el-steps :active="step" finish-status="success" class="steps" align-center>
          <el-step title="上传 PRD" />
          <el-step title="AI 解析" />
          <el-step title="生成故事" />
          <el-step title="拆解任务" />
          <el-step title="估算工时" />
          <el-step title="AI 分配" />
        </el-steps>

        <!-- 成员管理 -->
        <el-card class="block">
          <template #header>
            <div class="card-head">
              <span>团队成员</span>
              <el-button size="small" type="primary" @click="mDialog=true">+ 添加成员</el-button>
            </div>
          </template>
          <el-tag v-for="m in members" :key="m.id" class="m-tag" closable @close="removeMember(m.id)">
            {{ m.name }} · {{ m.role }}
          </el-tag>
          <div v-if="!members.length" class="empty-mini">暂无成员</div>
        </el-card>

        <!-- PRD 上传 -->
        <el-card class="block">
          <template #header>需求文档(PRD)</template>
          <el-form label-width="80px">
            <el-form-item label="标题">
              <el-input v-model="prdForm.title" placeholder="如:电商后台 PRD v1"></el-input>
            </el-form-item>
            <el-form-item label="PRD 内容">
              <el-input v-model="prdForm.content" type="textarea" :rows="6"
                placeholder="粘贴 PRD 文本,AI 会抽取功能点..."></el-input>
            </el-form-item>
            <el-form-item>
              <el-button type="primary" @click="saveRequirement" :loading="savingPrd">保存需求</el-button>
              <el-button type="success" @click="parseRequirement" :loading="parsing"
                :disabled="!currentReqId">① AI 解析功能点</el-button>
            </el-form-item>
          </el-form>
        </el-card>

        <!-- AI 解析结果 -->
        <el-card v-if="parsed" class="block">
          <template #header>AI 解析出的功能点</template>
          <p class="summary">{{ parsed.summary }}</p>
          <el-table :data="parsed.features" border size="small">
            <el-table-column prop="name" label="功能" />
            <el-table-column prop="description" label="描述" show-overflow-tooltip />
            <el-table-column prop="priority" label="优先级" width="100" />
          </el-table>
          <div style="margin-top:12px">
            <el-button type="success" @click="generateStories" :loading="generating">② 生成用户故事</el-button>
          </div>
        </el-card>

        <!-- 用户故事 -->
        <el-card v-if="stories.length" class="block">
          <template #header>用户故事</template>
          <el-table :data="stories" border size="small">
            <el-table-column prop="code" label="编号" width="80" />
            <el-table-column label="故事">
              <template #default="{ row }">
                作为 <b>{{ row.role }}</b>,我希望 <b>{{ row.goal }}</b>,以便 {{ row.benefit }}
              </template>
            </el-table-column>
            <el-table-column prop="priority" label="优先级" width="90" />
            <el-table-column prop="story_points" label="故事点" width="80" />
            <el-table-column label="操作" width="130">
              <template #default="{ row }">
                <el-button size="small" type="primary" @click="decompose(row.id)"
                  :loading="decomposingId===row.id">③ 拆任务</el-button>
              </template>
            </el-table-column>
          </el-table>
        </el-card>

        <!-- 任务看板 -->
        <el-card v-if="tasks.length" class="block">
          <template #header>
            <div class="card-head">
              <span>任务看板(共 {{ tasks.length }} 个)</span>
              <div>
                <el-button size="small" type="success" @click="estimate" :loading="estimating">④ AI 估算工时</el-button>
                <el-button size="small" type="warning" @click="assign" :loading="assigning"
                  :disabled="!members.length">⑤ AI 分配</el-button>
              </div>
            </div>
          </template>
          <el-table :data="tasks" border size="small">
            <el-table-column prop="title" label="任务" />
            <el-table-column prop="type" label="类型" width="90" />
            <el-table-column prop="complexity" label="复杂度" width="90" />
            <el-table-column prop="estimate_hours" label="估时(h)" width="100" />
            <el-table-column prop="assignee_name" label="负责人" width="100" />
            <el-table-column label="状态" width="120">
              <template #default="{ row }">
                <el-select v-model="row.status" size="small" @change="updateTask(row)">
                  <el-option label="待办" value="todo"></el-option>
                  <el-option label="进行中" value="doing"></el-option>
                  <el-option label="已完成" value="done"></el-option>
                </el-select>
              </template>
            </el-table-column>
          </el-table>
        </el-card>
      </div>
    </div>

    <!-- 新建项目对话框 -->
    <el-dialog v-model="pDialog" title="新建项目" width="500px">
      <el-form label-width="80px">
        <el-form-item label="项目名称">
          <el-input v-model="pForm.name"></el-input>
        </el-form-item>
        <el-form-item label="描述">
          <el-input v-model="pForm.description" type="textarea" :rows="3"></el-input>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="pDialog=false">取消</el-button>
        <el-button type="primary" @click="createProject">创建</el-button>
      </template>
    </el-dialog>

    <!-- 添加成员对话框 -->
    <el-dialog v-model="mDialog" title="添加成员" width="450px">
      <el-form label-width="80px">
        <el-form-item label="姓名"><el-input v-model="mForm.name"></el-input></el-form-item>
        <el-form-item label="角色">
          <el-select v-model="mForm.role">
            <el-option label="组长/产品" value="leader"></el-option>
            <el-option label="后端" value="backend"></el-option>
            <el-option label="前端" value="frontend"></el-option>
            <el-option label="测试" value="test"></el-option>
            <el-option label="运维" value="devops"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="技能">
          <el-input v-model="mForm.skillsStr" placeholder="逗号分隔,如:python,flask,sql"></el-input>
        </el-form-item>
        <el-form-item label="周工时">
          <el-input-number v-model="mForm.capacity" :min="1" :max="60"></el-input-number>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="mDialog=false">取消</el-button>
        <el-button type="primary" @click="addMember">添加</el-button>
      </template>
    </el-dialog>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.7.0/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
  <script>
    const { createApp, reactive, ref, computed, onMounted } = Vue;

    const app = createApp({
      setup() {
        const api = axios.create({ baseURL: '/api' });
        const msg = (t, m) => ElementPlus.ElMessage({ type: t, message: m });
        const err = (e, op) => msg('error', op + '失败:' + (e.response?.data?.error || e.message));

        const projects = ref([]);
        const loading = ref(false);
        const currentProject = ref(null);

        const members = ref([]);
        const stories = ref([]);
        const tasks = ref([]);
        const parsed = ref(null);
        const currentReqId = ref(null);

        const prdForm = reactive({ title: '', content: '' });
        const savingPrd = ref(false);
        const parsing = ref(false);
        const generating = ref(false);
        const decomposingId = ref(null);
        const estimating = ref(false);
        const assigning = ref(false);

        const pDialog = ref(false);
        const pForm = reactive({ name: '', description: '' });
        const mDialog = ref(false);
        const mForm = reactive({ name: '', role: 'backend', skillsStr: '', capacity: 40 });

        const step = computed(() => {
          if (assigning.value || tasks.value.some(t => t.assignee_id)) return 6;
          if (tasks.value.some(t => t.estimate_hours)) return 5;
          if (tasks.value.length) return 4;
          if (stories.value.length) return 3;
          if (parsed.value) return 2;
          if (currentReqId.value) return 1;
          return 0;
        });

        const loadProjects = async () => {
          loading.value = true;
          try { const { data } = await api.get('/projects'); projects.value = data; }
          finally { loading.value = false; }
        };
        const createProject = async () => {
          if (!pForm.name) return msg('warning', '请输入项目名称');
          await api.post('/projects', pForm);
          pDialog.value = false;
          pForm.name = ''; pForm.description = '';
          msg('success', '创建成功'); loadProjects();
        };
        const removeProject = async (id) => {
          await ElementPlus.ElMessageBox.confirm('确认删除该项目?', '提示', { type: 'warning' });
          await api.delete('/projects/' + id);
          msg('success', '已删除'); loadProjects();
        };

        const enterProject = async (p) => {
          currentProject.value = p;
          const pid = p.id;
          const [m, s, t, r] = await Promise.all([
            api.get('/members', { params: { project_id: pid } }),
            api.get('/stories', { params: { project_id: pid } }),
            api.get('/tasks', { params: { project_id: pid } }),
            api.get('/requirements', { params: { project_id: pid } }),
          ]);
          members.value = m.data; stories.value = s.data; tasks.value = t.data;
          if (r.data.length) {
            currentReqId.value = r.data[0].id;
            prdForm.title = r.data[0].title;
            prdForm.content = r.data[0].content;
          }
        };

        const saveRequirement = async () => {
          if (!prdForm.title || !prdForm.content) return msg('warning', '请填写标题和内容');
          savingPrd.value = true;
          try {
            const { data } = await api.post('/requirements', { project_id: currentProject.value.id, ...prdForm });
            currentReqId.value = data.id; msg('success', '需求已保存');
          } finally { savingPrd.value = false; }
        };
        const parseRequirement = async () => {
          parsing.value = true;
          try { const { data } = await api.post('/requirements/' + currentReqId.value + '/parse');
            parsed.value = data; msg('success', 'AI 解析出 ' + data.features.length + ' 个功能点');
          } catch (e) { err(e, 'AI 解析'); }
          finally { parsing.value = false; }
        };
        const generateStories = async () => {
          generating.value = true;
          try { const { data } = await api.post('/stories/generate', { requirement_id: currentReqId.value });
            stories.value = data; msg('success', '生成 ' + data.length + ' 个用户故事');
          } catch (e) { err(e, '生成故事'); }
          finally { generating.value = false; }
        };
        const decompose = async (sid) => {
          decomposingId.value = sid;
          try { const { data } = await api.post('/tasks/decompose', { story_id: sid });
            tasks.value = [...tasks.value, ...data]; msg('success', '拆解出 ' + data.length + ' 个任务');
          } catch (e) { err(e, '拆解任务'); }
          finally { decomposingId.value = null; }
        };
        const estimate = async () => {
          estimating.value = true;
          try { const { data } = await api.post('/tasks/estimate', { project_id: currentProject.value.id });
            tasks.value = data; msg('success', '工时估算完成');
          } catch (e) { err(e, '估算工时'); }
          finally { estimating.value = false; }
        };
        const assign = async () => {
          assigning.value = true;
          try { const { data } = await api.post('/tasks/assign', { project_id: currentProject.value.id });
            tasks.value = data; msg('success', 'AI 分配完成');
          } catch (e) { err(e, 'AI 分配'); }
          finally { assigning.value = false; }
        };
        const updateTask = async (row) => { await api.put('/tasks/' + row.id, { status: row.status }); };

        const addMember = async () => {
          if (!mForm.name) return msg('warning', '请输入姓名');
          await api.post('/members', {
            project_id: currentProject.value.id, name: mForm.name, role: mForm.role,
            skills: mForm.skillsStr.split(',').map(s => s.trim()).filter(Boolean),
            capacity_hours: mForm.capacity,
          });
          mDialog.value = false;
          mForm.name = ''; mForm.skillsStr = '';
          msg('success', '已添加');
          const { data } = await api.get('/members', { params: { project_id: currentProject.value.id } });
          members.value = data;
        };
        const removeMember = async (id) => {
          await api.delete('/members/' + id);
          const { data } = await api.get('/members', { params: { project_id: currentProject.value.id } });
          members.value = data;
        };

        onMounted(loadProjects);

        return {
          projects, loading, currentProject, members, stories, tasks, parsed, currentReqId,
          prdForm, savingPrd, parsing, generating, decomposingId, estimating, assigning,
          pDialog, pForm, mDialog, mForm, step,
          loadProjects, createProject, removeProject, enterProject,
          saveRequirement, parseRequirement, generateStories, decompose, estimate, assign, updateTask,
          addMember, removeMember,
        };
      }
    });
    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
